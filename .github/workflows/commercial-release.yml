# Build & publish THE GOLD MIND PROFESSIONAL release assets
name: commercial-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        default: "1.0.0"
      sign_mode:
        description: "unsigned | standard | ev"
        required: true
        default: "unsigned"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify Core SHA-256
        shell: pwsh
        run: |
          $cert = "75002e46e3c200292c3696b2767bba20f2dd4200c74078555f84bc1f54a033ce"
          $h = (Get-FileHash -Algorithm SHA256 "Experts/TheGoldMindAI_Professional.mq5").Hash.ToLowerInvariant()
          if ($h -ne $cert) { throw "CORE SHA MISMATCH: $h" }
          if (-not (Test-Path "Experts/TheGoldMindAI_Professional.ex5")) { throw "ex5 missing — compile before release" }

      - name: Build commercial release
        shell: pwsh
        run: |
          cd Commercial/Installer/Professional/scripts
          ./Build-CommercialRelease.ps1 -Version "${{ inputs.version }}" -SignMode unsigned -SkipValidate:$false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgm-professional-${{ inputs.version }}
          path: Commercial/Releases/${{ inputs.version }}/github-assets/**

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          $dir = "Commercial/Releases/$ver/github-assets"
          gh release create "v$ver" `
            --title "THE GOLD MIND PROFESSIONAL $ver" `
            --notes-file "Commercial/Releases/$ver/RELEASE_NOTES.md" `
            "$dir/Setup.exe" `
            "$dir/TheGoldMindSetup.exe" `
            "$dir/TGM_PROFESSIONAL_${ver}_stable.zip" `
            "$dir/SHA256SUMS.txt" `
            "$dir/SBOM.json" `
            "$dir/VERSION_MANIFEST.json"
